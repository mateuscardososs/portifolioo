<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social preview</title>
    <link rel="stylesheet" href="../assets/fonts/fonts.css">
    <style>
        * { box-sizing: border-box; }

        html,
        body {
            width: 1200px;
            height: 630px;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: #06070A;
            color: #F4F5F7;
            font-family: "Manrope", "Manrope Fallback", Arial, sans-serif;
        }

        .card {
            position: relative;
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            padding: 86px 92px;
            background:
                radial-gradient(circle at 72% 18%, rgba(124, 108, 255, 0.16), rgba(124, 108, 255, 0) 38%),
                linear-gradient(#232834, #232834) 0 96px / 100% 1px no-repeat,
                linear-gradient(#232834, #232834) 0 calc(100% - 98px) / 100% 1px no-repeat,
                linear-gradient(#232834, #232834) 46px 0 / 1px 100% no-repeat,
                linear-gradient(#232834, #232834) calc(100% - 46px) 0 / 1px 100% no-repeat,
                #06070A;
        }

        .content { transform: translateY(18px); }

        h1 {
            margin: 0;
            font-family: "Sora", "Sora Fallback", Arial, sans-serif;
            font-size: 92px;
            font-weight: 800;
            letter-spacing: -0.055em;
            line-height: 0.95;
        }

        p {
            margin: 24px 0 0;
            color: #7C6CFF;
            font-size: 43px;
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="content">
            <h1>Mateus Cardoso</h1>
            <p>Desenvolvedor Backend Java</p>
        </div>
    </main>
</body>
</html>
